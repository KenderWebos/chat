<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Chat Socket.IO</title>
  <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
</head>
<body>
  <h2>Chat Socket.IO</h2>

  <input id="room" placeholder="Nombre de chat" />
  <button onclick="joinRoom()">Unirse</button>
  <br /><br />

  <div id="chat" style="display:none;">
    <div id="messages" style="border:1px solid #ccc; height:200px; overflow:auto;"></div>
    <input id="msgInput" placeholder="Mensaje" />
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    const socket = io('http://192.168.1.8:7777'); // Cambia aquí

    function joinRoom() {
      const room = document.getElementById('room').value.trim();
      if (!room) return alert('Ingresa nombre de chat');
      socket.emit('join', { room });
      document.getElementById('chat').style.display = 'block';
      addMessage(`Te uniste al chat: ${room}`);
    }

    function sendMessage() {
      const room = document.getElementById('room').value.trim();
      const msg = document.getElementById('msgInput').value.trim();
      if (!msg) return;
      socket.emit('message', { room, msg });
      document.getElementById('msgInput').value = '';
    }

    socket.on('message', data => {
      addMessage(`${data.sid}: ${data.msg}`);
    });

    socket.on('system', msg => {
      addMessage(`[Sistema] ${msg}`);
    });

    function addMessage(text) {
      const div = document.createElement('div');
      div.textContent = text;
      const messages = document.getElementById('messages');
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
